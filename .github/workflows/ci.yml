name: CI

on:
  push:
  pull_request:
  # Lets deploy.yml reuse these exact jobs as its gate, so the tests that guard a
  # deploy are the same ones that run on every push -- not a second, drifting copy.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e packages/workflow-core -e apps/api[dev]
      - run: pytest packages/workflow-core/tests apps/api/tests
      - run: ruff check apps/api packages/workflow-core
      - run: ruff check apps/api packages/workflow-core --select I

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run web:test
      - run: npm run web:build
