[project]
name = "workflow-core"
version = "0.1.0"
description = "Canonical workflow parsing, graph construction, and static validation for WorkflowGuard."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22.0",
  "lxml>=5.2.0",
  "networkx>=3.3",
  "pydantic>=2.7.0",
  "python-magic>=0.4.27; platform_system != 'Windows'",
]

[project.scripts]
workflowguard = "workflow_core.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow_core"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "PLC", "PERF", "RUF012"]
