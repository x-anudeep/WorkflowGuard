services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflowguard
      POSTGRES_USER: workflowguard
      POSTGRES_PASSWORD: workflowguard
    ports:
      - "5432:5432"
    volumes:
      - workflowguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflowguard -d workflowguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The execution engine. Workflow tests are compiled to n8n workflows and really run here;
  # their integration calls are redirected back at the API's /mock endpoints, so an emitted
  # workflow carries no credentials and cannot reach a real service.
  # Executes the code inside uploaded workflows, in its own process and on a network that
  # cannot reach anything but this stack. Separate from n8n so a snippet that hangs, crashes or
  # eats memory takes the runner down rather than the engine every other test is running in.
  n8n-runner:
    image: n8nio/runners:2.38.7
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-workflowguard-local-runner}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      # A snippet gets ten seconds, matching the bound on a whole run.
      N8N_RUNNERS_TASK_TIMEOUT: "10"
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: "256"
      N8N_RUNNERS_MAX_CONCURRENCY: "2"
    depends_on:
      n8n:
        condition: service_healthy
    networks: [sandbox]
    # Uploaded code cannot starve the host even if it tries.
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.38.7
    networks: [sandbox]
    environment:
      # Code runs in the external runner above, never in this process.
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-workflowguard-local-runner}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_TASK_TIMEOUT: "10"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-workflowguard-local}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
      # A test suite creates hundreds of executions and n8n retains each one with its full
      # data. Left unpruned it exhausts the heap partway through and dies mid-run.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "500"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      # Bounded rather than generous. Pruning is what stops the heap growing; a large ceiling
      # only lets n8n crowd out the rest of the machine before pruning matters. Observed at
      # 7 GB RSS under a full differential run with a 4 GB ceiling -- old-space limits do not
      # cap buffers or external memory.
      NODE_OPTIONS: --max-old-space-size=2048
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - workflowguard_n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    networks: [sandbox, default]
    environment:
      WORKFLOWGUARD_DATABASE_URL: postgresql+psycopg://workflowguard:workflowguard@db:5432/workflowguard
      WORKFLOWGUARD_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}","http://127.0.0.1:${WEB_PORT:-3000}"]'
      WORKFLOWGUARD_N8N_BASE_URL: http://n8n:5678
      WORKFLOWGUARD_N8N_API_KEY: ${WORKFLOWGUARD_N8N_API_KEY:-}
      # n8n calls this back during a run, so it must be the API's address on the compose
      # network -- not localhost, which inside the n8n container is n8n itself.
      WORKFLOWGUARD_MOCK_BASE_URL: http://api:8000/mock
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      n8n:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/workflow-core:/app/packages/workflow-core
      - ./examples:/app/examples
    command: >
      sh -c "cd /app/apps/api &&
      alembic upgrade head &&
      uvicorn workflowguard_api.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}/api
      INTERNAL_API_BASE_URL: http://api:8000/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
    command: sh -c "rm -rf /app/apps/web/.next && npm --workspace apps/web run dev"

networks:
  # No route off the host. n8n and the runner can reach the API's /mock endpoints and each
  # other, and nothing else - so a redirected integration call cannot escape even if the URL
  # rewriting were ever bypassed, and uploaded code cannot call out.
  #
  # Publishing n8n's editor port below is a convenience for local development. A deployment that
  # wants the egress guarantee intact should drop that port mapping and reach the editor another
  # way; a published port is a route in, and n8n is then reachable from outside this network.
  sandbox:
    internal: true

volumes:
  workflowguard_pg:
  workflowguard_n8n:
