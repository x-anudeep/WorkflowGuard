services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflowguard
      POSTGRES_USER: workflowguard
      POSTGRES_PASSWORD: workflowguard
    ports:
      - "5432:5432"
    volumes:
      - workflowguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflowguard -d workflowguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      WORKFLOWGUARD_DATABASE_URL: postgresql+psycopg://workflowguard:workflowguard@db:5432/workflowguard
      WORKFLOWGUARD_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}","http://127.0.0.1:${WEB_PORT:-3000}"]'
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/workflow-core:/app/packages/workflow-core
      - ./examples:/app/examples
    command: >
      sh -c "cd /app/apps/api &&
      alembic upgrade head &&
      uvicorn workflowguard_api.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/node_modules
    command: npm --workspace apps/web run dev

volumes:
  workflowguard_pg:
