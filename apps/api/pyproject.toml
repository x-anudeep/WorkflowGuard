[project]
name = "workflowguard-api"
version = "0.1.0"
description = "FastAPI backend for WorkflowGuard."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.111.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.3.4",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.31",
  "structlog>=24.2.0",
  "uvicorn[standard]>=0.30.1",
  "workflow-core",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflowguard_api"]

[tool.ruff]
line-length = 110
target-version = "py311"
